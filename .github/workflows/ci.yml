name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Install, Migrate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ---------- Backend ----------
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Create backend .env (CI dummy values only — not real secrets)
        working-directory: backend
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=file:./dev.db
          JWT_SECRET=ci_dummy_jwt_secret_at_least_32_characters_long_xxx
          GROQ_API_KEY=dummy-ci-key-not-real
          GROQ_MODEL=llama-3.1-8b-instant
          CLIENT_URL=http://localhost:5173
          PORT=4000
          EOF

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Apply Prisma migrations (SQLite)
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Build backend
        working-directory: backend
        run: npm run build

      # ---------- Frontend ----------
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Create frontend .env (CI dummy values only)
        working-directory: frontend
        run: |
          cat > .env <<'EOF'
          VITE_API_URL=/api
          EOF

      - name: Build frontend
        working-directory: frontend
        run: npm run build
